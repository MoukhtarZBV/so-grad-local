plugins {
    id 'java'
    id 'jacoco'
    id 'org.sonarqube' version '7.2.3.7755'
}
group = 'example.orders'
version = '1.0.0'
repositories { mavenCentral() }
java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}
dependencies {
    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
test {
    useJUnitPlatform()
}
jacoco { toolVersion = '0.8.14' }
jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}
sonar {
    properties {
        property 'sonar.projectKey', System.getenv('SONAR_PROJECT_KEY') ?: 'orders-gradle-lab'
        property 'sonar.projectName', 'Orders Gradle Lab'
        property 'sonar.host.url', System.getenv('SONAR_HOST_URL') ?: 'http://localhost:9000'
        property 'sonar.coverage.jacoco.xmlReportPaths', layout.buildDirectory.file('reports/jacoco/test/jacocoTestReport.xml').get().asFile.absolutePath
    }
}
// Explicit order: compile/test, coverage XML, then analysis. No local coverage check:
// the feature stage must pass tests and fail the Sonar coverage quality gate.
tasks.named('sonar') { dependsOn tasks.named('jacocoTestReport') }
